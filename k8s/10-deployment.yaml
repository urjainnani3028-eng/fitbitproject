apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitbit-app
  namespace: fitbit
  labels:
    app.kubernetes.io/name: fitbit-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fitbit-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below 2 ready pods during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fitbit-app
      annotations:
        # Tells Prometheus to scrape this pod (see monitoring/values.yaml)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: fitbit-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
            - name: metrics
              containerPort: 8000
          env:
            - name: METRICS_PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
